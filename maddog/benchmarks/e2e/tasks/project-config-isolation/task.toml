prompt = "This workspace contains both maddog.sample.toml and maddog.toml. Treat the Maddog sample config as the source of truth and ignore Maddog-owned files. Read maddog.sample.toml, then write provider-summary.txt with exactly three lines: default=<default_model>, frontier=<agent.frontier_model>, storage=.maddog. Do not copy any value from maddog.toml."
max_steps = 18
timeout_sec = 240
tags = ["config", "maddog-isolation", "provider", "frontier", "headless-cli"]
requires = ["provider", "filesystem", "maddog.toml"]

[expect]
min_tool_calls = 2
