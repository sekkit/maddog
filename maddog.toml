default_model = "deepseek-flash"

[agent]
max_steps = 0
temperature = 0.0
auto_plan = "off"
soft_compact_ratio = 0.5
compact_ratio = 0.8
compact_force_ratio = 0.9
frontier_model = "icodeeasy/gpt-5.5"
upgrade_enabled = true
upgrade_threshold = 3
frontier_budget = 500000

[[providers]]
name = "deepseek-flash"
kind = "openai"
base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"
api_key_env = "DEEPSEEK_API_KEY"
balance_url = "https://api.deepseek.com/user/balance"
context_window = 1000000
price = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" }

[[providers]]
name = "deepseek-pro"
kind = "openai"
base_url = "https://api.deepseek.com"
model = "deepseek-v4-pro"
api_key_env = "DEEPSEEK_API_KEY"
balance_url = "https://api.deepseek.com/user/balance"
context_window = 1000000
price = { cache_hit = 0.025, input = 3, output = 6, currency = "¥" }

[[providers]]
name = "icodeeasy"
kind = "openai"
base_url = "https://jp.icodeeasy.cc"
models = ["gpt-5.5", "gpt-5.4", "gpt-5.4-mini"]
default = "gpt-5.5"
api_key_env = "ICE_API_KEY"
context_window = 400000
wire_api = "responses"
reasoning_protocol = "openai"
supported_efforts = ["low", "medium", "high"]
default_effort = "high"
price = { cache_hit = 0, input = 0, output = 0, currency = "$" }

[[providers]]
name = "pxpipe-claude"
kind = "anthropic"
base_url = "http://127.0.0.1:47821"
model = "claude-fable-5"
api_key_env = "ICE_API_KEY"
context_window = 1000000
thinking = "adaptive"
effort = "high"
no_proxy = true

[[providers]]
name = "pxpipe-gpt"
kind = "openai"
base_url = "http://127.0.0.1:47821/v1"
api_key_env = "ICE_API_KEY"
context_window = 1000000
wire_api = "responses"
reasoning_protocol = "openai"
supported_efforts = ["low", "medium", "high"]
default_effort = "high"
no_proxy = true

[tools]
enabled = []
bash_timeout_seconds = 120

[codegraph]
enabled = true
auto_install = true

[lsp]
enabled = true

[permissions]
mode = "ask"

[sandbox]
bash = "enforce"
network = true
