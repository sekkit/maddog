version: 2
project_name: maddog

before:
  hooks:
    - go mod download

builds:
  - id: maddog
    main: ./cmd/maddog
    binary: maddog
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: maddog
    ids: [maddog]
    name_template: "maddog-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

homebrew_casks:
  - name: maddog
    ids: [maddog]
    # Prereleases (v*-rc*) must not update the stable tap; brew has no separate
    # prerelease channel, so a pushed rc cask becomes the default `brew install`.
    # npm is a separate line (release-npm.yml, `npm-v*`), so an npm prerelease no
    # longer drags brew along — a stable `v*` cask can ship while npm stays on rc.
    skip_upload: "auto"
    repository:
      owner: sekkit
      name: homebrew-maddog
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/sekkit/maddog"
    description: "Cache-first Maddog coding agent for the terminal."
    commit_author:
      name: maddog
      email: maddog@users.noreply.github.com
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/maddog"]
          end

release:
  prerelease: auto
  name_template: "Maddog CLI {{ .Tag }}"
